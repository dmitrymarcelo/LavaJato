name: Deploy (Cloudflare Pages + Supabase)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Build frontend
        env:
          VITE_API_URL: https://vqutbhklwnvvpmvletqb.supabase.co/functions/v1/api
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: pnpm run build

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lavajato-norte-tech --commit-dirty=true

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy api \
            --project-ref vqutbhklwnvvpmvletqb \
            --no-verify-jwt

      - name: Health check
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          sleep 15
          curl -fsS "https://vqutbhklwnvvpmvletqb.supabase.co/functions/v1/api/health" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            && echo "✅ Edge function healthy" \
            || echo "⚠️  Health check falhou (nao bloqueia deploy)"
